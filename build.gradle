plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.1980suciono'

version = '1.0.0'

base {
    archivesName = 'CacheManager2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
	maven { url 'https://jitpack.io' } 
	
}

dependencies {

	implementation fileTree(dir: 'libs', include: ['*.jar'])
	 implementation 'com.github.1980suciono:CacheManager2:1.0.0'
}


publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
